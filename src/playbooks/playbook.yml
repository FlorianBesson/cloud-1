---
 - name: Play test
   hosts: servers
   vars:
     packages:
      - name: vim
        required: true
      - name: neofetch
        required: true
      - name: cowsay
        required: false
   tasks:
     - name: 'Install {{ item.name }} on scw server'
       apt: 
            name: "{{ item.name }}"
            state: present
       loop: "{{ packages }}"
...
