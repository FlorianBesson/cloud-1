name: cloud1

services:
  nginx:
    container_name: nginx
    build: ./requirement/NGINX/.
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - wordpress

  mariadb:
    container_name: mariadb
    build: ./requirement/MariaDB/.
    expose:
      - "3306"
    env_file:
      - .env
  
  phpmyadmin:
    container_name: phpmyadmin
    build: ./requirement/Phpmyadmin/.
  
  wordpress:
    container_name: wordpress
    build: ./requirement/WordPress
    expose:
      - "9000"
    env_file:
      - .env
